---
- name: Prepare Docker host for bulletin board deployment
  hosts: app_servers
  become: true
  vars:
    docker_users:
      - "{{ ansible_user }}"
    docker_install_compose_plugin: true
    docker_install_compose: false
    app_domain: hexlet-vorobev.chickenkiller.com
    app_host_port: 8080
    allowed_tcp_ports:
      - "22"
      - "80"
      - "443"
    denied_tcp_ports:
      - "8080"
      - "9090"

  pre_tasks:
    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
          - htop
          - nginx
          - python3
          - python3-docker
          - python3-pip
          - ufw
          - unzip
        state: present
      when: ansible_os_family == "Debian"

  roles:
    - role: geerlingguy.docker

  tasks:
    - name: Create Nginx cache directory
      ansible.builtin.file:
        path: /var/cache/nginx/bulletin-board
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Configure Nginx cache storage
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/bulletin-board-cache.conf
        mode: "0644"
        content: |
          proxy_cache_path /var/cache/nginx/bulletin-board
              levels=1:2
              keys_zone=bulletin_board_static:20m
              max_size=256m
              inactive=24h
              use_temp_path=off;
      notify: Reload nginx

    - name: Configure Nginx reverse proxy
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/bulletin-board
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name {{ app_domain }};

              gzip on;
              gzip_types
                  application/javascript
                  application/json
                  image/svg+xml
                  text/css
                  text/plain;

              location /assets/ {
                  proxy_pass http://127.0.0.1:{{ app_host_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache bulletin_board_static;
                  proxy_cache_valid 200 30d;
                  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                  add_header Cache-Control "public, max-age=2592000, immutable" always;
                  add_header X-Cache-Status $upstream_cache_status always;
              }

              location ~* ^/(favicon\.ico|manifest\.json|robots\.txt)$ {
                  proxy_pass http://127.0.0.1:{{ app_host_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache bulletin_board_static;
                  proxy_cache_valid 200 7d;
                  add_header Cache-Control "public, max-age=604800" always;
                  add_header X-Cache-Status $upstream_cache_status always;
              }

              location ~* ^/api/files/(view|raw)$ {
                  proxy_pass http://127.0.0.1:{{ app_host_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache bulletin_board_static;
                  proxy_cache_valid 200 1h;
                  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                  add_header Cache-Control "public, max-age=3600" always;
                  add_header X-Cache-Status $upstream_cache_status always;
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:{{ app_host_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  add_header Cache-Control "no-store" always;
              }

              location / {
                  proxy_pass http://127.0.0.1:{{ app_host_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  add_header Cache-Control "no-cache" always;
              }
          }
      notify: Reload nginx

    - name: Enable Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/bulletin-board
        dest: /etc/nginx/sites-enabled/bulletin-board
        state: link
      notify: Reload nginx

    - name: Disable default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Apply Nginx configuration
      ansible.builtin.meta: flush_handlers

    - name: Allow required TCP ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ allowed_tcp_ports }}"

    - name: Remove direct public access to application ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        delete: true
      loop: "{{ denied_tcp_ports }}"

    - name: Deny incoming traffic by default
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow outgoing traffic by default
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable firewall
      community.general.ufw:
        state: enabled

    - name: Check Docker Engine
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Check Docker Compose plugin
      ansible.builtin.command: docker compose version
      register: docker_compose_version
      changed_when: false

    - name: Show installed Docker versions
      ansible.builtin.debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ docker_compose_version.stdout }}"

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
